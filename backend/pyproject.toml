[project]
name = "geoalpha"
version = "0.1.0"
description = "GeoAlpha: geopolitically-aware multi-agent ticker analysis (research only, not financial advice)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0.30",
    "sse-starlette>=2.1",
    "tradingagents @ git+https://github.com/TauricResearch/TradingAgents@v0.7.1",
    "worldmonitor-sdk==0.1.2",
    "yfinance>=1.7.0",
    "exchange-calendars>=4.5",
    "python-ulid>=2.7",
    "typer>=0.12",
    "markdown-it-py>=3.0",
    "python-dotenv>=1.0",
    "torch>=2.3",
    "einops>=0.8",
    "huggingface-hub>=0.33",
    "safetensors>=0.4",
    "tqdm>=4.66",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "jsonschema>=4.22",
    "referencing>=0.35",
    "pyyaml>=6.0",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.scripts]
geoalpha = "geoalpha.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/geoalpha"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra -m 'not integration'"
markers = ["integration: needs network, model weights or real LLM keys"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = ["src/geoalpha/vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.12"
packages = ["geoalpha"]
mypy_path = "src"
strict = true
exclude = ["src/geoalpha/vendor/"]

[[tool.mypy.overrides]]
module = ["tradingagents.*", "pandas.*", "worldmonitor_sdk.*", "yfinance.*", "exchange_calendars.*", "sse_starlette.*"]
ignore_missing_imports = true

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Body", "fastapi.Query", "fastapi.Header"]

[[tool.mypy.overrides]]
module = ["geoalpha.vendor.*"]
follow_imports = "skip"
ignore_missing_imports = true

[tool.ruff.lint.per-file-ignores]
"src/geoalpha/api/export.py" = ["E501"]  # inline CSS/SVG templates
